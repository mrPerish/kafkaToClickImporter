spring:
  application:
    name: kafkaToClickImporter
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/default}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:kafka-to-click-importer}
      auto-offset-reset: earliest
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:1000}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      ack-mode: batch

importer:
  topic: ${IMPORTER_TOPIC:smev3-billing}
  # Ключ — значение заголовка __TypeId__.
  routes:
    ExportChargesRequest:
      type: ru.rtksoft.smev3.billing.dto.ExportChargesRequestBillingData
      # Таблица выбирается по значению json-поля; неизвестное значение — ошибка, сообщение пропускается.
      discriminator-field: ct_charge_type
      tables-by-discriminator:
        ChargesConditions: raw_smev3_export_charges_cc_req
        PayersConditions: raw_smev3_export_charges_pc_req
        TimeConditions: raw_smev3_export_charges_tc_req
    ExportChargesResponse:
      type: ru.rtksoft.smev3.billing.dto.ExportChargesResponseBillingData
      table: raw_smev3_export_charges_res
    ExportNoticeRequest:
      type: ru.rtksoft.smev3.billing.dto.ExportNoticeRequestBillingData
      table: raw_smev3_export_notice_req
    ExportPaymentsRequest:
      type: ru.rtksoft.smev3.billing.dto.ExportPaymentsRequestBillingData
      table: raw_smev3_export_payment_details_req
    ExportPaymentsResponse:
      type: ru.rtksoft.smev3.billing.dto.ExportPaymentsResponseBillingData
      table: raw_smev3_export_payment_details_res
    ImportPaymentsRequest:
      type: ru.rtksoft.smev3.billing.dto.ImportPaymentsRequestBillingData
      table: raw_smev3_import_payments_req
    ImportPaymentsResponse:
      type: ru.rtksoft.smev3.billing.dto.ImportPaymentsResponseBillingData
      table: raw_smev3_import_payments_res
    RequestRejected:
      type: ru.rtksoft.smev3.billing.dto.RequestRejectedBillingData
      table: raw_smev3_non_business_res
    DeliveryDocumentsRequestBillingData:
      type: ru.rtksoft.smev3.billing.dto.DeliveryDocumentsRequestBillingData
      table: raw_smev3_delivery_data_documents_req
    PersonalDocumentsRequestBillingData:
      type: ru.rtksoft.smev3.billing.dto.PersonalDocumentsRequestBillingData
      table: raw_smev3_personal_data_documents_req
    PersonalDocumentsResponseBillingData:
      type: ru.rtksoft.smev3.billing.dto.PersonalDocumentsResponseBillingData
      table: raw_smev3_personal_data_documents_res

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
